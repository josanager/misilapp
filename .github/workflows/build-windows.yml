name: Build and package MISIL for Windows

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Restore JavaScript dependencies
        run: npm ci

      - name: Test local storage and MISIL Hub
        run: npm test

      - name: Run Windows service checks
        run: dotnet run --project windows/MISILNative.Checks/MISILNative.Checks.csproj -c Release

      - name: Resolve and validate release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content windows/MISILNative/MISILNative.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "La versión '$version' no es SemVer estable." }
          $isPrerelease = $false
          if ('${{ github.ref_type }}' -eq 'tag') {
            $stableTag = "v$version"
            $betaPattern = '^v' + [Regex]::Escape($version) + '-beta\.\d+$'
            $isPrerelease = '${{ github.ref_name }}' -match $betaPattern
            if ('${{ github.ref_name }}' -ne $stableTag -and -not $isPrerelease) {
              throw "El tag ${{ github.ref_name }} no coincide con $stableTag ni con una beta de esa versión."
            }
          }
          "MISIL_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MISIL_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress --yes }
          if (-not (Test-Path $iscc)) { throw 'No se encontró ISCC.exe.' }

      - name: Publish self-contained executables and build installer
        shell: pwsh
        run: ./windows/scripts/build-release.ps1 -Version $env:MISIL_VERSION

      - name: Verify required release files
        shell: pwsh
        run: |
          $release = 'windows/artifacts/release'
          $required = @(
            "MISIL-Setup-$env:MISIL_VERSION-x64.exe",
            "MISIL-$env:MISIL_VERSION-win-x64.zip",
            'misil-release.json',
            'checksums-sha256.txt'
          )
          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $release $file))) { throw "Falta el artefacto $file" }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MISIL-${{ env.MISIL_VERSION }}-windows-x64
          path: windows/artifacts/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem 'windows/artifacts/release' -File | ForEach-Object { $_.FullName }
          if ($assets.Count -lt 4) { throw 'No están completos los artefactos de la release.' }
          $releaseTitle = if ($env:MISIL_PRERELEASE -eq 'true') { "MISIL $env:MISIL_VERSION Beta" } else { "MISIL $env:MISIL_VERSION" }
          $arguments = @(
            'release'; 'create'; '${{ github.ref_name }}'
            $assets
            '--repo'; '${{ github.repository }}'
            '--title'; $releaseTitle
            '--generate-notes'
            '--verify-tag'
          )
          if ($env:MISIL_PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          gh @arguments
